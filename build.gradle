// Settings every library in this repository shares.
//
// Core has NO Minecraft on its classpath, and neither does anything built on it.
// That is deliberate: if a module compiles here, it is provably free of
// net.minecraft imports and can be dropped into a project for any game version.

subprojects {
    apply plugin: 'java-library'

    group = 'dev.px'
    version = '1.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // Lombok: compile-time only, nothing lands in the jar.
        compileOnly 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'
        testCompileOnly 'org.projectlombok:lombok:1.18.30'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

        // Gson ships with Minecraft on every version, so it is compileOnly here.
        compileOnly 'com.google.code.gson:gson:2.8.9'

        // The test suites run with no Minecraft to supply it, so tests need it for real.
        testImplementation 'com.google.code.gson:gson:2.8.9'
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:-unchecked' << '-parameters'
    }
}

// Core: the version-independent half of a client. Every other module builds on it.
//
// To use Core without Gradle, copy core/src/main/java/dev/px/core into a project
// for any game version and add Lombok and Gson.

plugins {
    // Checks, FakePlatform and RecordingLogger, shared with every module's tests
    // so they run headless the same way Core's do, and the NanoVG window every
    // module's visual harness opens.
    id 'java-test-fixtures'
}

// LWJGL natives for whatever machine this is being built on.
ext {
    lwjglVersion = '3.3.3'
    lwjglNatives = {
        String os = System.getProperty('os.name').toLowerCase()
        String arch = System.getProperty('os.arch').toLowerCase()
        boolean arm = arch.startsWith('aarch64') || arch.startsWith('arm')
        if (os.contains('mac')) {
            return arm ? 'natives-macos-arm64' : 'natives-macos'
        }
        if (os.contains('win')) {
            return 'natives-windows'
        }
        return arm ? 'natives-linux-arm64' : 'natives-linux'
    }()
}

// A runnable visual harness: a real window, a real renderer, the real HUD.
tasks.register('visual', JavaExec) {
    group = 'verification'
    description = 'Opens a window and renders the HUD with NanoVG.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.px.core.test.visual.VisualTest'
    // GLFW must own the first thread on macOS, or creating a window aborts.
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

dependencies {
    // ---- visual harness only -------------------------------------------------
    // LWJGL + NanoVG, so the HUD and the GUI can be driven by a real renderer in
    // a real window. The backend lives in the test fixtures so every module's
    // harness shares it, and `api` so their tests compile against it. Test scope
    // on purpose: Core itself still has no dependencies, and `compileJava` still
    // proves it.
    testFixturesApi platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    testFixturesApi 'org.lwjgl:lwjgl'
    testFixturesApi 'org.lwjgl:lwjgl-glfw'
    testFixturesApi 'org.lwjgl:lwjgl-opengl'
    testFixturesApi 'org.lwjgl:lwjgl-nanovg'
    testFixturesRuntimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    testFixturesRuntimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    testFixturesRuntimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    testFixturesRuntimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"

    // The fixtures use Lombok like the rest of the tests.
    testFixturesCompileOnly 'org.projectlombok:lombok:1.18.30'
    testFixturesAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}
